# CI (Ausbaustufe 2: Lint + Tests + Image-Build, Non-root-Check, Smoke-Test,
# Trivy-Gate, SBOM). IaC-Checks und Secret-Scan folgen in einem spaeteren PR.
# "CI passed" ist der Required Check fuer main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to the same PR supersedes the running check; runs on main are
  # never cancelled (CD depends on them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE: weatherwatch:ci
  TRIVY_VERSION: v0.69.3

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      # Real PostgreSQL for the integration tests (tests marked "integration").
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weatherwatch
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: weatherwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weatherwatch -d weatherwatch_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://weatherwatch:ci-only-not-a-secret@localhost:5432/weatherwatch_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Coverage gate: fail_under = 80 in pyproject.toml makes this step red
      # when coverage drops below 80 %.
      - name: Tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build, scan & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (with GitHub Actions layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container does not run as root
        run: |
          user="$(docker run --rm "$IMAGE" whoami)"
          echo "container user: $user"
          test "$user" != "root"

      - name: Runtime image contains no pip
        run: |
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v pip || python -m pip --version' ; then
            echo "pip found in runtime image" >&2; exit 1
          fi

      - name: Smoke test the image (/health, /ready, /metrics)
        run: |
          docker run -d --name ww -p 8000:8000 --read-only --tmpfs /tmp "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8000/ready | grep -q '"status":"ready"'
          curl -sf http://127.0.0.1:8000/metrics | grep -q 'weatherwatch_info'
          echo "smoke test passed"
      - name: Container logs
        if: always()
        run: docker logs ww || true; docker rm -f ww || true

      # Security gate. Threshold (documented in MONITORING.md and ADR 0003):
      # the build fails on CRITICAL vulnerabilities that already have a fix.
      - name: Trivy image scan (gate - CRITICAL with fix fails the build)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # Full report (HIGH + CRITICAL, informational) for the Security tab and
      # as downloadable artifact; runs even when the gate above failed.
      - name: Trivy report (SARIF, HIGH and CRITICAL)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          # Without this, trivy-action drops the severity filter for SARIF.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        # Fails on private repos without GitHub Advanced Security; the report
        # is still kept as an artifact below.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Upload Trivy report and SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            trivy-results.sarif
            sbom.cdx.json
          if-no-files-found: warn

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a required job did not succeed" >&2; exit 1; }
          done
